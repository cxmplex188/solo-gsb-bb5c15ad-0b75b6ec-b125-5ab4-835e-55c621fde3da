services:
  clause-validator:
    build: .
    image: clause-reference-validator:latest
    container_name: clause-reference-validator
    ports:
      - "3000:3000"
    volumes:
      - clause-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clause-data:
